quarkus:
  rest-client:
    boavizta-api-url:
      uri: "http://localhost:0/boavizta"
    ecologits-api-url:
      uri: "http://localhost:0/ecologits"
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:target/wombat-test.db"
      min-size: 0
  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: true
    clean-at-start: true
    clean-disabled: false
    locations: classpath:db/migration
  scheduler:
    enabled: false
  devservices:
    enabled: false
  kubernetes-client:
    devservices:
      enabled: false
  log:
    category:
      "org.testcontainers.dockerclient":
        level: "OFF"
      "tech.illuin.wombat.persistence.backup":
        level: "OFF"
  jacoco:
    data-file: target/jacoco.exec
    reuse-data-file: true
    report: false

monitor:
  cron: "0 0 0 ? * MON#5 2099"
  environments-file: monitored-environments-test.yaml

persistence:
  enable-kubernetes-metrics-persister: true

backup:
  enabled: false
  s3:
    endpoint: "http://localhost:0"
    bucket: "wombat-test"
    key-prefix: "tests/"
    access-key: "test"
    secret-key: "test"

profiles:
  seeds:
    - id: "test-aws-c5"
      type: INFRASTRUCTURE
      description: "Test AWS c5.large FRA"
      provider: aws
      instance-type: "c5.large"
      location: "FRA"
      lifespan: 43800
    - id: "test-gcp-n2"
      type: INFRASTRUCTURE
      description: "Test GCP n2 FRA"
      provider: gcp
      instance-type: "n2-standard-4"
      location: "FRA"
      lifespan: 43800
    - id: "test-mistral-large"
      type: LLM
      description: "Test Mistral Large"
      provider: mistralai
      location: "FRA"
      model: "mistral-large-latest"
      output-token-count: 500
      request-per-year: 1000000
