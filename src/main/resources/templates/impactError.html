{#include impactLayout.html}

{#headScripts}
  <script src="/impactError.js"></script>
{/headScripts}

<!-- Filter bar -->
<form class="filter-bar" method="get" action="" id="filterForm">
  <div class="filter-group">
    <span class="filter-label">From</span>
    <input type="datetime-local" name="from" id="inputFrom" value="{from}"/>
  </div>
  <div class="filter-group">
    <span class="filter-label">To</span>
    <input type="datetime-local" name="to" id="inputTo" value="{to}"/>
  </div>
  <button type="submit" class="btn-apply">Apply</button>
</form>

<!-- Main -->
<div class="main">
  <div class="error-card">
    <div class="error-header">
      <div class="error-dot"></div>
      <span class="error-label">No data</span>
    </div>
    <div class="error-title">No CPU usage found</div>
    <div class="error-body">
      No CPU metrics were recorded for the selected time range.
      Try a wider range or check that the monitoring agent is running.
    </div>
  </div>
</div>

{/include}
