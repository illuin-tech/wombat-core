quarkus:
  banner:
    path: wombat-banner.txt
  rest-client:
    logging:
      scope: none
      body-limit: 1024
    boavizta-api-url:
      uri: "https://api.boavizta.org/v1/"
    ecologits-api-url:
      uri: "https://api.ecologits.ai/"
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
      "io.quarkus.kubernetes.client.deployment.DevServicesKubernetesProcessor":
        level: "OFF"
      "io.quarkus.datasource.deployment.devservices.DevServicesDatasourceProcessor":
        level: "OFF"
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:data/db/local.db"
      min-size: 0
  hibernate-orm:
    schema-management:
      strategy: none
  flyway:
    migrate-at-start: false
    locations: classpath:db/migration
  kubernetes-client:
    devservices:
      enabled: false
  micrometer:
    binder:
      netty:
        enabled: false
      http-client:
        enabled: false

monitor:
  cron: "*/10 * * * * ?" # every 10s

metrics:
  aggregation-window:
    duration: 5
    unit: MINUTES

ui:
  max-date-range:
    duration: 1
    unit: MONTHS

persistence:
  enable-kubernetes-metrics-persister: true

backup:
  enabled: false
  cron: "0 0 2 * * ?"

profiles:
  seeds:
    - id: "aws-c5a-16xlarge"
      type: INFRASTRUCTURE
      description: "AWS c5a.16xlarge FRA"
      provider: aws
      instance-type: "c5a.16xlarge"
      location: "FRA"
      lifespan: 43800
    - id: "aws-c5a-4xlarge"
      type: INFRASTRUCTURE
      description: "AWS c5a.4xlarge FRA"
      provider: aws
      instance-type: "c5a.4xlarge"
      location: "FRA"
      lifespan: 43800
    - id: "aws-c5-large"
      type: INFRASTRUCTURE
      description: "AWS c5.large FRA"
      provider: aws
      instance-type: "c5.large"
      location: "FRA"
      lifespan: 43800
    - id: "gcp-n2-highcpu-32"
      type: INFRASTRUCTURE
      description: "GCP n2-highcpu-32 FRA"
      provider: gcp
      instance-type: "n2-highcpu-32"
      location: "FRA"
      lifespan: 43800
    - id: "mistralai-mistral-large"
      type: LLM
      description: "Mistral Large latest"
      provider: mistralai
      location: "FRA"
      model: "mistral-large-latest"
      output-token-count: 500
      request-per-year: 1000000000
