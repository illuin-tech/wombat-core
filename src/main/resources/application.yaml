quarkus:
  rest-client:
    logging:
      scope: request-response
      body-limit: 1024
    boavizta-api-url:
      uri: "https://api.boavizta.org/v1/"
  log:
    category:
      "persistence":
        min-level: TRACE
        level: TRACE
  datasource:
    db-kind: sqlite
    jdbc:
      url: "jdbc:sqlite:data/db/local.db"
      min-size: 0
  hibernate-orm:
    schema-management:
      strategy: update
    sql-load-script: sqlite/init.sql

monitor:
  cron: "*/10 * * * * ?" # every 10s

persistence:
  enable-memory-target: true

backup:
  enabled: false
  cron: "0 0 2 * * ?"

profile:
  server:
    enable: true
    provider: aws
    instance-type: "c5a.16xlarge"
    location: "FRA"
    lifespan: 43800 # 5 years
